<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>harness</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      #app {
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <!-- Loads apps/<name>/index.js, named by ?app=, as a module; its own
         import statements pull in everything else (lib files, D3 from an
         ESM CDN URL), same as the Colab shim, so "looks right locally" ==
         "looks right in Colab". -->
    <script>
      const app = new URLSearchParams(location.search).get('app');

      if (!app) {
        console.log('no app specified -- add ?app=<name>, e.g. ?app=tictactoe/idea0');
      } else {
        const entryPath = `apps/${app}/index.js`;

        // Tab title is the app folder's last path component (e.g. "idea0"
        // for tictactoe/idea0); index.js runs after this and can set
        // document.title itself.
        document.title = app.split('/').pop();

        const s = document.createElement('script');
        s.type = 'module';
        s.src = `/${entryPath}`;
        s.onerror = () => {
          console.error('failed to load', s.src);
          document.getElementById('app').textContent = `error: ${entryPath} not found`;
        };
        document.body.appendChild(s);
      }
    </script>
  </body>
</html>
